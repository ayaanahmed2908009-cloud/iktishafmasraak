<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Our Partners</title>
<style>
  .partners-section {
    box-sizing: border-box;
    padding: 56px 0;
    background: #ffffff;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .partners-section *, .partners-section *::before, .partners-section *::after { box-sizing: border-box; }
  @media (min-width: 640px) { .partners-section { padding: 80px 0; } }

  .partners-header {
    max-width: 1280px;
    margin: 0 auto 40px;
    padding: 0 20px;
  }
  @media (min-width: 640px) { .partners-header { padding: 0 32px; } }
  @media (min-width: 1024px) { .partners-header { padding: 0 48px; } }

  .partners-title {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    color: #1E293B;
  }
  .partners-subtitle {
    margin: 8px 0 0;
    font-size: 16px;
    color: #64748B;
  }
  @media (min-width: 640px) {
    .partners-title { font-size: 30px; }
    .partners-subtitle { font-size: 18px; }
  }

  /* RTL support: add dir="rtl" to .partners-section to right-align the header */
  .partners-section[dir="rtl"] .partners-title,
  .partners-section[dir="rtl"] .partners-subtitle { text-align: right; }

  .marquee-viewport { position: relative; }
  .marquee-track {
    display: flex;
    width: max-content;
    animation: partners-marquee 25s linear infinite;
  }
  .marquee-viewport:hover .marquee-track { animation-play-state: paused; }

  @keyframes partners-marquee {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  .logo-group {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: 48px;
    padding-right: 48px;
  }

  .partner-card {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 96px;
    width: 176px;
    background: #ffffff;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    padding: 16px 20px;
  }
  @media (min-width: 640px) {
    .partner-card { height: 128px; width: 240px; }
  }
  .partner-card img {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    filter: grayscale(100%);
    transition: filter 0.3s ease;
  }
  .partner-card:hover img { filter: grayscale(0%); }

  .marquee-fade {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 64px;
    pointer-events: none;
    z-index: 10;
  }
  @media (min-width: 640px) { .marquee-fade { width: 96px; } }
  .marquee-fade.left  { left: 0;  background: linear-gradient(to right, #fff, transparent); }
  .marquee-fade.right { right: 0; background: linear-gradient(to left,  #fff, transparent); }
</style>
</head>
<body>
